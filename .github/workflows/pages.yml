name: Build Mallard Static Site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'source-index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mallard-static-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test document engine
        run: npm run test:mallard-documents

      - name: Build compiled site
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Publish compiled files into Pages branch source
        run: |
          rm -rf assets icons legacy
          cp dist/source-index.html index.html
          cp -R dist/assets assets
          cp -R dist/icons icons
          if [ -d dist/legacy ]; then cp -R dist/legacy legacy; fi
          cp dist/manifest.webmanifest manifest.webmanifest
          if [ -f dist/mallard-manifest.webmanifest ]; then cp dist/mallard-manifest.webmanifest mallard-manifest.webmanifest; fi

      - name: Commit compiled site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets icons legacy manifest.webmanifest mallard-manifest.webmanifest
          if git diff --cached --quiet; then
            echo "Compiled site is already current."
            exit 0
          fi
          git commit -m "Publish compiled Mallard site"
          git push origin HEAD:main
